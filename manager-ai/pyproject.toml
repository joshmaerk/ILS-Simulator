[project]
name = "manager-ai"
version = "0.1.0"
description = "Multi-agent AI management assistant for Microsoft Teams"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-projects>=1.0.0b11",
    "azure-identity>=1.17",
    "azure-cosmos>=4.7",
    "botbuilder-core>=4.15",
    "botbuilder-schema>=4.15",
    "botbuilder-integration-aiohttp>=4.15",
    "msgraph-sdk>=1.3",
    "aiohttp>=3.9",
    "pydantic-settings>=2.2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "opencensus-ext-azure>=1.1",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = [
    "E501",  # line too long — black handles wrapping
]

[tool.ruff.lint.isort]
known-first-party = [
    "agents",
    "bot",
    "config",
    "graph",
    "memory",
    "orchestrator",
    "tools",
]

# ── Black ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false

# Targeted safe subset (Azure SDK stubs are incomplete → no full strict)
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true

# Azure, botbuilder, msgraph ship incomplete stubs
ignore_missing_imports = true

exclude = [
    "^infra/",
    "^tests/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
ignore_errors = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "INFO"
addopts = ["--tb=short", "--strict-markers"]
markers = [
    "integration: mark test as requiring live Azure connections",
    "unit: mark test as not requiring Azure",
]
