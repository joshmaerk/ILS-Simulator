[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ibcs-feedback-agent"
version = "1.0.0"
description = "Azure AI Foundry Agent for IBCS SUCCESS standard compliance checking"
requires-python = ">=3.11"
readme = "README.md"

# ---------------------------------------------------------------------------
# pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-q",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring real Azure credentials",
    "visual: marks tests requiring GPT-4o Vision calls",
]
filterwarnings = [
    "ignore::DeprecationWarning:pptx",
    "ignore::DeprecationWarning:openpyxl",
]

# ---------------------------------------------------------------------------
# Coverage configuration
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "*/site-packages/*",
    "setup.py",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70          # Minimum 70% coverage enforced in CI
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# ---------------------------------------------------------------------------
# Ruff linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no stray prints)
    "SIM",  # flake8-simplify
]
ignore = [
    "S101",  # assert used in tests
    "S105",  # Hardcoded password — false positives for test keys
    "S106",  # Same
    "S603",  # subprocess — needed for LibreOffice rendering
    "B008",  # Function calls in default args (Pydantic pattern)
    "T201",  # print() — used in CLI commands
    "E501",  # Line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]  # No security/print checks in tests

[tool.ruff.lint.isort]
known-first-party = ["ibcs_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true   # Azure SDK stubs incomplete
no_implicit_optional = true
strict_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pptx.*", "pdfplumber.*", "openpyxl.*", "pdf2image.*", "fitz.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# bandit security scanner
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B601"]   # assert, shell=True (controlled internal usage)
