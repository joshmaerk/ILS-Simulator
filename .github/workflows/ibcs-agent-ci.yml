name: IBCS Agent CI

on:
  push:
    branches: ["ibcs_dev", "main"]
    paths:
      - "ibcs_agent/**"
      - ".github/workflows/ibcs-agent-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "ibcs_agent/**"

defaults:
  run:
    working-directory: ibcs_agent

env:
  PYTHON_VERSION: "3.11"
  # Disable Azure calls in CI — tests use mocks
  ENABLE_VISUAL_ANALYSIS: "false"
  AZURE_OPENAI_ENDPOINT: "https://ci-placeholder.openai.azure.com/"
  AZURE_OPENAI_API_KEY: "ci-placeholder-key"
  AZURE_OPENAI_MODEL_NAME: "gpt-4o"
  LOG_LEVEL: "WARNING"

jobs:
  # =========================================================================
  # Job 1: Lint & Format check
  # =========================================================================
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Run ruff linter
        run: ruff check . --output-format=github

      - name: Run ruff formatter check
        run: ruff format --check .

  # =========================================================================
  # Job 2: Type checking
  # =========================================================================
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mypy pydantic python-pptx openpyxl pdfplumber Pillow python-dotenv PyYAML openai
          pip install types-PyYAML

      - name: Run mypy
        run: |
          mypy \
            models/ rules/ config.py security.py observability.py \
            --ignore-missing-imports \
            --no-error-summary \
            || true   # Non-blocking — mypy findings are informational in CI

  # =========================================================================
  # Job 3: Security scan
  # =========================================================================
  security:
    name: Security Scan (bandit + pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install scanners
        run: pip install bandit[toml] pip-audit

      - name: Run bandit (SAST)
        run: |
          bandit -r . \
            --exclude ./tests,./.venv \
            --severity-level medium \
            --confidence-level medium \
            -f json \
            -o bandit-report.json \
            || true
          bandit -r . \
            --exclude ./tests,./.venv \
            --severity-level high \
            --confidence-level high
          # Fail on HIGH severity findings only

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          pip install -r requirements.txt --quiet
          pip-audit --requirement requirements.txt \
            --format json \
            --output pip-audit-report.json \
            || true
          # Report but don't block (vulnerabilities may be in transitive deps)
          pip-audit --requirement requirements.txt --format columns || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            ibcs_agent/bandit-report.json
            ibcs_agent/pip-audit-report.json
          retention-days: 30

  # =========================================================================
  # Job 4: Tests + Coverage
  # =========================================================================
  test:
    name: Tests & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies (poppler for PDF rendering)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock coverage[toml]

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -m "not integration and not visual" \
            -v

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: ibcs_agent/coverage.xml
          retention-days: 14

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-html-report
          path: ibcs_agent/htmlcov/
          retention-days: 14

      - name: Coverage summary in PR
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const xml = fs.readFileSync('ibcs_agent/coverage.xml', 'utf8');
              const match = xml.match(/line-rate="([0-9.]+)"/);
              if (match) {
                const pct = Math.round(parseFloat(match[1]) * 100);
                const emoji = pct >= 80 ? '✅' : pct >= 70 ? '⚠️' : '❌';
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `${emoji} **IBCS Agent Test Coverage: ${pct}%**\n\nSee the [coverage report artifact](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
                });
              }
            } catch(e) { console.log('Could not post coverage comment:', e.message); }

  # =========================================================================
  # Job 5: Integration tests (only on manual trigger or push to main)
  # =========================================================================
  integration-test:
    name: Integration Tests (Azure)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: azure-integration  # Requires environment protection rules

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Run integration tests
        env:
          AZURE_AI_FOUNDRY_CONNECTION_STRING: ${{ secrets.AZURE_AI_FOUNDRY_CONNECTION_STRING }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_MODEL_NAME: ${{ secrets.AZURE_OPENAI_MODEL_NAME }}
          ENABLE_VISUAL_ANALYSIS: "true"
        run: pytest -m "integration" -v --timeout=120

  # =========================================================================
  # Job 6: Build & Package (smoke test)
  # =========================================================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Verify package builds
        run: |
          pip install -r requirements.txt
          python -c "
          from ibcs_agent.rules.ibcs_rules import ALL_RULES
          from ibcs_agent.models.feedback import IBCSFeedbackReport
          from ibcs_agent.config import load_config
          from ibcs_agent.security import validate_filename, validate_rule_id
          from ibcs_agent.observability import health_check
          print(f'Rules loaded: {len(ALL_RULES)}')
          print(f'Health check: {health_check()[\"status\"]}')
          print('Build check passed.')
          "

      - name: Verify CLI entry point
        run: python -m ibcs_agent.agent.agent --help

  # =========================================================================
  # Status badge summary
  # =========================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, test, build]
    if: always()

    steps:
      - name: Report CI status
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
